#!/usr/sbin/nft -f
#
# wglan firewall skeleton — default-deny on the mesh interface, nothing else on
# the host touched. Print a copy with `wglan firewall`; install it wherever your
# nftables config is loaded from, e.g.:
#
#     wglan firewall > /etc/nftables.d/wglan.conf
#     nft -c -f /etc/nftables.d/wglan.conf     # check before you commit to it
#     nft -f    /etc/nftables.d/wglan.conf
#
# wglan never edits nftables itself. This file is yours: it survives a reboot and
# an `nftables` restart, which rules added at runtime by a daemon do not.
#
# Two knobs, both matching wglan's own defaults. Change them here if you passed
# --interface or --control-port.
define WGLAN_IFACE = "wglan0"
define WGLAN_CONTROL_PORT = 51821

# Create-then-delete-then-define, so reloading this file is idempotent and
# rebuilds the table atomically rather than merging into a stale one. The bare
# `table` line exists only so the `delete` cannot fail on a first run.
table inet wglan
delete table inet wglan

table inet wglan {
	# A base chain at policy ACCEPT. Not `policy drop`: every inbound packet
	# traverses every base chain at this hook, a policy cannot be conditioned on
	# an interface, and a drop in any base chain is final — so `policy drop` here
	# would take the whole host offline, LAN SSH and WireGuard's own UDP port
	# included. The default-deny is scoped by the two rules instead.
	chain input {
		type filter hook input priority 0; policy accept;

		# `iifname`, not `iif`: `iif` matches an interface index resolved at load
		# time, so it needs the interface to exist already and silently stops
		# matching if it is deleted and recreated. The name survives a re-create.
		iifname $WGLAN_IFACE jump mesh
		iifname $WGLAN_IFACE drop
	}

	# The allow-list. A regular chain, jumped into from above, so rules appended
	# here land ahead of that terminal drop — which they would not if the drop and
	# the allow-list shared one chain.
	chain mesh {
		# First, and load-bearing. Without it a default-deny input chain drops the
		# replies to every connection this host *initiates* over the mesh: they
		# arrive on ephemeral ports nothing allows. That includes the echo-reply to
		# its own ping, so `ping <peer>` would work in one direction only.
		# `related` also admits ICMP errors, which keeps path-MTU discovery alive
		# on a 1420-byte tunnel.
		ct state established,related accept

		# wglan's own control plane. SPEC §6.1 requires LEAVE and PROBE to arrive
		# inside the tunnel, and nothing else here would ever let them in.
		tcp dport $WGLAN_CONTROL_PORT accept

		# So a peer can ping this node. The first thing anyone reaches for.
		icmp type echo-request accept

		# ------------------------------------------------------------------
		# Your per-node allow rules go here. Uncomment what this host serves.
		#
		#   tcp dport 22 accept        # ssh
		#   tcp dport 443 accept       # https, on the node that serves it
		#
		# Note this chain is at the *input* hook, so it gates host processes. A
		# container port published with `-p` is DNAT'd and forwarded, never
		# delivered to input, so it bypasses this file entirely — gate those in
		# Docker's DOCKER-USER forward chain, or run the container with host
		# networking and allow the port here.
		# ------------------------------------------------------------------
	}
}
